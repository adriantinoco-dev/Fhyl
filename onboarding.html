<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Comece sua experiência no catálogo de filmes e séries do Fhyl."
    />
    <title>Fhyl — Começar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./onboarding.html" aria-label="Fhyl início">
          <span class="brand-mark">F</span>
          <span>fhyl</span>
        </a>

        <div class="header-note">protótipo de catálogo</div>
      </div>
    </header>

    <main class="page-shell onboarding-page">
      <section class="onboarding-card" aria-labelledby="onboarding-title">
        <p class="eyebrow">bem-vindo ao fhyl</p>
        <h1 id="onboarding-title">Como podemos chamar você?</h1>
        <p class="onboarding-description">
          Salve seu nome para personalizar sua experiência no catálogo.
        </p>

        <form class="onboarding-form" id="onboarding-form">
          <div class="form-field">
            <label for="username-input">Seu nome</label>
            <input
              id="username-input"
              name="username"
              type="text"
              maxlength="40"
              autocomplete="name"
              placeholder="Digite seu nome"
              required
              autofocus
            />
          </div>
          <button class="button button-primary" type="submit">Começar</button>
          <p class="onboarding-status" id="onboarding-status" role="status"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>Dados de filmes e séries fornecidos por <a href="https://www.themoviedb.org/" target="_blank" rel="noreferrer">TMDB</a>.</p>
      <p>Protótipo local — listas salvas apenas neste navegador.</p>
    </footer>

    <script src="onboarding.js" defer></script>
  </body>
</html>
